<!DOCTYPE html>
<html lang="am">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>ለአንቺ</title>

    <style>

        body {
            margin: 0;
            min-height: 100vh;

            display: flex;
            justify-content: center;
            align-items: center;

            text-align: center;

            background: linear-gradient(
                135deg,
                #ff758c,
                #ff7eb3,
                #ffb6c1
            );

            font-family: Arial, sans-serif;
        }

        .love-card {
            width: 80%;
            max-width: 600px;

            padding: 40px;

            background: rgba(255, 255, 255, 0.20);

            border-radius: 30px;

            box-shadow:
                0 10px 40px rgba(0, 0, 0, 0.25);

            backdrop-filter: blur(10px);

            color: white;
        }

        h1 {
            font-size: 40px;
            margin-bottom: 20px;
        }

        p {
            font-size: 20px;
            line-height: 1.8;
        }

        .heart {
            font-size: 55px;
            margin-bottom: 10px;
        }

        h2 {
            font-size: 28px;
            margin-top: 30px;
        }

    .gallery {
    display: grid;
    grid-template-columns: repeat(2, 1fr);
    gap: 15px;
    margin-top: 20px;
}

.gallery img {
    width: 100%;
    height: 180px;
    object-fit: contain;
    border-radius: 20px;
    box-shadow: 0 5px 15px rgba(0, 0, 0, 0.25);
    transition: 0.3s;
}

.gallery img:hover {
    transform: scale(1.05);
}
    /* ❤️ Floating Hearts Animation */

.floating-heart {
    position: fixed;
    bottom: -50px;
    font-size: 25px;
    pointer-events: none;
    animation: floatHeart 6s linear forwards;
    z-index: 9999;
}

@keyframes floatHeart {
    0% {
        transform: translateY(0) rotate(0deg);
        opacity: 1;
    }

    50% {
        opacity: 0.8;
    }

    100% {
        transform: translateY(-110vh) rotate(360deg);
        opacity: 0;
    }
}
   /* 📸 Full Screen Photo */

.photo-fullscreen {
    position: fixed;
    top: 0;
    left: 0;
    width: 100vw;
    height: 100vh;
    background: rgba(0, 0, 0, 0.9);
    display: flex;
    justify-content: center;
    align-items: center;
    z-index: 10000;
    padding: 20px;
    box-sizing: border-box;
}

.photo-fullscreen img {
    max-width: 95%;
    max-height: 95%;
    object-fit: contain;
    border-radius: 15px;
    animation: photoZoom 0.3s ease;
}

@keyframes photoZoom {
    from {
        transform: scale(0.7);
        opacity: 0;
    }
    to {
        transform: scale(1);
        opacity: 1;
    }
}
   /* ❤️ Side Sliding Photos */

.slideshow {
    width: 100%;
    overflow: hidden;
    margin-top: 25px;
    border-radius: 25px;
}

.slides-track {
    display: flex;
    width: max-content;
    animation: slidePhotos 18s linear infinite;
}

.slides-track img {
    width: 280px;
    height: 320px;
    object-fit: contain;
    margin-right: 15px;
    border-radius: 20px;
    flex-shrink: 0;
    box-shadow: 0 5px 15px rgba(0,0,0,0.25);
}

@keyframes slidePhotos {
    from {
        transform: translateX(0);
    }

    to {
        transform: translateX(-50%);
    }
}
   
/* ❤️ Romantic Photo Effect */

.slides-track img {
    transition: transform 0.5s ease, filter 0.5s ease;
}

/* 📱 Touch / Mouse Effect */
.slides-track img:hover {
    transform: scale(1.08);
    filter: brightness(1.08);
}

/* ✨ Romantic Glow */
.slideshow {
    box-shadow:
        0 0 15px rgba(255, 105, 180, 0.35),
        0 0 35px rgba(255, 182, 193, 0.25);
    animation: romanticGlow 3s ease-in-out infinite;
}

@keyframes romanticGlow {
    0%, 100% {
        box-shadow:
            0 0 15px rgba(255, 105, 180, 0.35),
            0 0 35px rgba(255, 182, 193, 0.25);
    }

    50% {
        box-shadow:
            0 0 25px rgba(255, 105, 180, 0.6),
            0 0 50px rgba(255, 182, 193, 0.45);
    }
}
   </style>
</head>


<body>

    <div class="love-card">

        <div class="heart">♥</div>

        <h1>ሰላም ፍቅሬ</h1>

        <p>
            አንቺን በጣም እወድሻለሁ።
        </p>

        <h2>
            ለአንቺ የምልሽ ❤️
        </h2>

        <p>
            ምን ያህል እንደምወድሽ
            በቃላት ለመግለጽ አንዳንድ ጊዜ ይከብደኛል።
        </p>

        <p>
            ግን አንድ ነገር እርግጠኛ ነኝ፤
            በሕይወቴ ውስጥ ልዩ ቦታ አለሽ።
        </p>

        <p>
            ከአንቺ ጋር የማሳልፈው
            እያንዳንዱ ጊዜ ለእኔ የማይረሳ ትዝታ ነው። ❤️
        </p>
<h2>📸 የእኛ ትዝታዎች ❤️</h2>

<div class="gallery">

    <img src="images/photo1.jpg" alt="የእኛ ትዝታ">
    <img src="images/photo2.jpg" alt="የእኛ ትዝታ">
    <img src="images/photo3.jpg" alt="የእኛ ትዝታ">
    <img src="images/photo4.jpg" alt="የእኛ ትዝታ">
    <img src="images/photo5.jpg" alt="የእኛ ትዝታ">
    <img src="images/photo6.jpg" alt="የእኛ ትዝታ">

</div>
<!-- ❤️ የፍቅር Slideshow -->

<div class="slideshow">

    <div class="slides-track">

        <img src="images/photo1.jpg">
        <img src="images/photo2.jpg">
        <img src="images/photo3.jpg">
        <img src="images/photo4.jpg">
        <img src="images/photo5.jpg">
        <img src="images/photo6.jpg">

        <!-- 🔄 ለቀጣይ ዙር የተደገሙ -->
        <img src="images/photo1.jpg">
        <img src="images/photo2.jpg">
        <img src="images/photo3.jpg">
        <img src="images/photo4.jpg">
        <img src="images/photo5.jpg">
        <img src="images/photo6.jpg">

    </div>

</div>

<div class="music">
    <h2>🎵 የእኛ ዘፈን ❤️</h2>

    <p>ይህን ዘፈን ስሰማ አንቺን አስታውሳለሁ ❤️</p>

    <audio controls>
        <source src="music/Love-song.mp3" type="audio/mpeg">
    </audio>
</div>
        <h2>
            አንቺን እመርጣለሁ።
            <br>
            ዛሬም፣ ነገም፣ ሁሌም። ♥
        </h2>

    </div>
<script>
function createHeart() {

    const heart = document.createElement("div");

    heart.className = "floating-heart";
    heart.innerHTML = "❤️";

    heart.style.left = Math.random() * 100 + "vw";
    heart.style.fontSize = (15 + Math.random() * 30) + "px";
    heart.style.animationDuration = (4 + Math.random() * 4) + "s";

    document.body.appendChild(heart);

    setTimeout(() => {
        heart.remove();
    }, 8000);
}

setInterval(createHeart, 700);
</script>

<script>
const photos = document.querySelectorAll(".gallery img");

photos.forEach(photo => {

    photo.addEventListener("click", function() {

        const fullScreen = document.createElement("div");
        fullScreen.className = "photo-fullscreen";

        const image = document.createElement("img");
        image.src = this.src;

        fullScreen.appendChild(image);
        document.body.appendChild(fullScreen);

        fullScreen.addEventListener("click", function() {
            fullScreen.remove();
        });

    });

});
</script>

<script>
function createRomanticHeart() {

    const heart = document.createElement("div");

    heart.innerHTML = "❤️";
    heart.style.position = "fixed";
    heart.style.bottom = "-30px";
    heart.style.left = Math.random() * 100 + "vw";
    heart.style.fontSize = (12 + Math.random() * 22) + "px";
    heart.style.opacity = "0.8";
    heart.style.pointerEvents = "none";
    heart.style.zIndex = "9999";

    heart.animate(
        [
            {
                transform: "translateY(0) rotate(0deg)",
                opacity: 0
            },
            {
                transform: "translateY(-50vh) rotate(180deg)",
                opacity: 0.8
            },
            {
                transform: "translateY(-110vh) rotate(360deg)",
                opacity: 0
            }
        ],
        {
            duration: 5000 + Math.random() * 3000,
            easing: "linear"
        }
    );

    document.body.appendChild(heart);

    setTimeout(() => {
        heart.remove();
    }, 8000);
}

setInterval(createRomanticHeart, 1200);
</script>
</body>

</html>
